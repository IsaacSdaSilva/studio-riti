<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda da Riti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Agenda de Cliente Riti Cruz</h1>
    <p>Controle fácil de corte, data, horário e contato da cliente.</p>
  </header>
  <main>
    <div class="card" id="form-card">
      <h2>Adicionar agendamento</h2>
      <div class="message" id="message"></div>
      <form id="appointment-form">
        <div class="grid">
          <div>
            <label for="clientName">Nome da cliente</label>
            <input type="text" id="clientName" placeholder="Ex: Maria Silva" required />
          </div>
          <div>
            <label for="contact">Contato</label>
            <input type="tel" id="contact" placeholder="Telefone ou WhatsApp" required />
          </div>
          <div>
            <label for="serviceType">Serviço / Corte</label>
            <select id="serviceType" required>
              <option value="">Selecione</option>
              <option value="Corte feminino">Corte feminino</option>
              <option value="Corte masculino">Corte masculino</option>
              <option value="Coloração">Coloração</option>
              <option value="Penteado">Penteado</option>
              <option value="Escova">Escova</option>
              <option value="Outro">Outro</option>
            </select>
          </div>
          <div>
            <label for="appointmentDate">Data</label>
            <input type="date" id="appointmentDate" required />
          </div>
          <div>
            <label for="appointmentTime">Horário (09:00–19:30)</label>
            <input type="time" id="appointmentTime" required />
          </div>
          <div>
            <label for="notes">Observações</label>
            <textarea id="notes" placeholder="Ex: desejar cabelo mais curto, alérgica a... "></textarea>
          </div>
        </div>
        <button type="submit">Salvar agendamento</button>
      </form>
    </div>
    <div class="card" id="list-card">
      <h2>Agendamentos</h2>
      <div id="appointment-list"></div>
    </div>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
